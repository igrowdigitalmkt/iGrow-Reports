name: Bootstrap open-source project

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/bootstrap-open-source.yml'

permissions:
  contents: write
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Create release and roadmap issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag: 'v0.1.0' });
              core.info('Release v0.1.0 already exists.');
            } catch (error) {
              if (error.status !== 404) throw error;

              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: 'v0.1.0',
                target_commitish: 'master',
                name: 'iGrow Reports v0.1.0',
                prerelease: true,
                body: `Initial public release of iGrow Reports.

Highlights:
- Open-source foundation under the Apache License 2.0
- Multi-tenant organization and client architecture
- Supabase authentication and Row Level Security foundations
- Client-facing dashboard and reporting foundations
- Meta Ads integration and synchronization work
- Automated quality checks, database tests, and browser tests
- Contribution guidelines, security policy, and GitHub issue/PR templates

This is an early public release. The project is under active development and public adoption is still at an early stage.`
              });
              core.info('Created release v0.1.0.');
            }

            const issueSpecs = [
              {
                title: 'Improve Meta Ads sync observability and partial-data handling',
                body: `## Problem

Advertising APIs can return partial, delayed, or inconsistent data. The Meta integration needs clearer observability so maintainers can distinguish provider limitations, authorization problems, rate limits, and internal transformation errors.

## Proposed work

- Add structured sync diagnostics
- Distinguish partial-data states from hard failures
- Improve logging without exposing access tokens or client data
- Add tests for incomplete and degraded provider responses
- Document expected recovery behavior

## Why this matters

Better diagnostics reduce maintainer triage time and make the integration safer to operate.`
              },
              {
                title: 'Expand multi-tenant security tests for organization and client isolation',
                body: `## Problem

iGrow Reports stores data for multiple organizations and clients. Tenant boundaries must remain protected as new features and integrations are added.

## Proposed work

- Expand Row Level Security test coverage
- Add negative authorization cases
- Test client-area access revocation
- Cover cross-organization identifiers and report access
- Document the security invariants contributors must preserve

## Why this matters

Tenant isolation is a core security property of the project and should be continuously verified.`
              },
              {
                title: 'Define a provider adapter contract for Google Ads and TikTok Ads',
                body: `## Problem

The reporting layer should not become tightly coupled to a single advertising provider as new integrations are introduced.

## Proposed work

- Define a common provider interface
- Separate provider-native fields from normalized reporting metrics
- Document error and rate-limit semantics
- Add fixture-based contract tests
- Use the contract as the foundation for future Google Ads and TikTok Ads integrations

## Why this matters

A stable provider boundary will make new integrations easier to contribute, review, and maintain.`
              },
              {
                title: 'Add an internationalization foundation for the public UI',
                body: `## Problem

The application interface is currently primarily in Portuguese, which limits contribution and adoption outside Portuguese-speaking teams.

## Proposed work

- Identify user-facing strings that should be localized
- Introduce a lightweight localization structure
- Preserve Portuguese as a supported locale
- Add English translations for the core navigation and public/demo surfaces
- Document how contributors add new strings and locales

## Why this matters

Internationalization lowers the barrier for contributors and users from other regions without changing the product's current Portuguese experience.`
              }
            ];

            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'all', per_page: 100 }
            );

            for (const issue of issueSpecs) {
              if (existing.some(item => item.title === issue.title && !item.pull_request)) {
                core.info(`Issue already exists: ${issue.title}`);
                continue;
              }

              const created = await github.rest.issues.create({
                owner,
                repo,
                title: issue.title,
                body: issue.body
              });
              core.info(`Created issue #${created.data.number}: ${issue.title}`);
            }
